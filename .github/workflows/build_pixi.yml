name: Build with Pixi

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-pixi:
    name: Build with Pixi (${{ matrix.ros_distro }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ros_distro: [jazzy, lyrical, rolling]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install Pixi environment
      uses: prefix-dev/setup-pixi@v0.11.2
      with:
        pixi-version: v0.78.0
        environments: ${{ matrix.ros_distro }}

    # Build one package at a time to stay within the memory of the GitHub-hosted
    # runners. Tests are compiled too, so that a broken test fails the PR.
    - name: Build
      run: pixi run -e ${{ matrix.ros_distro }} build --executor sequential
