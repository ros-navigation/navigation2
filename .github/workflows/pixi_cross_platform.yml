name: Pixi cross-platform build

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            platform: osx-64
          - os: macos-15
            platform: osx-arm64
          - os: windows-2022
            platform: win-64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.75.0
          cache: true

      - name: Build and test nav2_ros_common
        run: pixi run ci-test
